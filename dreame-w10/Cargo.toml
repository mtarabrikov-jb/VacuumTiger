# Workspace for the Dreame W10 "over-ava" bridge for VacuumTiger.
#
# The W10 runs a proprietary navigation daemon (`ava`) that exclusively owns the
# motor-controller MCU (/dev/ttyS4) and the LDS/LIDAR (/dev/ttyS3). Rather than
# replace it, this bridge taps `ava`'s serial I/O read-only and re-exposes it so
# a VacuumTiger `dreame_w10` DeviceDriver can consume odometry/IMU/LDS while
# `ava` keeps the robot safe. See README.md.
[workspace]
resolver = "2"
members = ["proto", "shm", "avatap", "avatap-relay", "w10-decode", "mcud"]
# avatap is a no_std cdylib that must build panic=abort; it's cross-compiled for
# the robot in release. Exclude it from default host `cargo build`/`test` (which
# use the dev profile's panic=unwind) — build it explicitly with -p avatap.
default-members = ["proto", "shm", "avatap-relay", "w10-decode", "mcud"]

# panic=abort: the tap is a no_std cdylib injected into `ava` and must never
# unwind across the C ABI; abort keeps the relay small too.
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
codegen-units = 1
